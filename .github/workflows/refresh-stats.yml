name: Refresh activity cards

on:
  schedule:
    # 07:20 America/Halifax, which is 10:20 UTC. Off the hour on purpose: the
    # top of the hour is the busiest slot on GitHub's scheduler and delays there
    # can run to tens of minutes.
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the cards
        env:
          # STATS_TOKEN is optional. The built-in token can read this account's
          # public contribution counts, which is all the cards claim to show.
          # Set STATS_TOKEN only if the figures ever need to include private
          # contributions, which requires a personal token with read:user.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_stats.py

      - name: Check live sites
        # No token: every site on the list is public and served through the
        # tunnel, so this is the same GET a visitor makes.
        run: python tools/build_status.py

      - name: Commit when a figure moved
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh the activity cards"
          git push
