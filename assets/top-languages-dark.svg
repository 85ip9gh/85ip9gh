<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
<title id="title">Top public-repository languages</title>
<desc id="desc">JavaScript 21.6 percent, Java 17.4 percent, TypeScript 13.5 percent, HTML 12.2 percent, ShaderLab 11.9 percent, Python 7.1 percent, and 16.3 percent across other languages. Measured by GitHub-reported bytes.</desc>
<style>
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .rise { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
    .sweep { transform-origin: left center; animation: sweep .7s cubic-bezier(.2,.7,.3,1) both; }
    .grow { transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.3,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .sweep, .grow { animation: none; }
    }
</style>
